states:
  - observation.state.end.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 7

  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 7
            end: 8

actions:
  - action.end.position:
      origin_keys:
        - action:
            start: 0
            end: 7
      subtract_state: true
      relative_type: quaternion_local

  - action.effector.position:
      origin_keys:
        - action:
            start: 7
            end: 8
      subtract_state: false

images:
  # Wrist stays the only Qwen/Depth/DINO view and must remain first. Tactile
  # RGB is loaded separately through data.tactile_rgb_key.
  - observation.images.camera_wrist_left

norm_stats: assets/norm_stats/tacthru_umi_v2_tactile_v1.json
