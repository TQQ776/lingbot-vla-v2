name: TacThru
cam_path: /dev/v4l/by-id/usb-Generic_USB_Camera_0001-video-index0
fps: 30
resolution:
- 640
- 480
fourcc: MJPG
# 新款 5x7 TacThru 直接在裁剪后的原始图像上跟踪，不再做旧版去畸变。
