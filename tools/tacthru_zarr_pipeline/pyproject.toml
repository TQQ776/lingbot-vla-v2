[project]
name = "tacthru"
version = "1.0.0"
requires-python = "==3.11.*"

dependencies = [
    "opencv-python>=4.11.0.86",
    "numpy>=2.2.6",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "loguru>=0.7.3",
    "pre-commit>=4.3.0",
    "typing-extensions>=4.15.0",
    "openvr>=2.12.1401",
    "cv2-enumerate-cameras>=1.3.3",
    "omegaconf>=2.3.0",
    "atomics>=1.0.3",
    "cupy-cuda12x>=14.0.1",
    "torch>=2.7.0",
    "pynput>=1.8.1",
    "pyzmq>=27.1.0",
    "dearpygui>=2.2",
    "pyexiftool>=0.5.6",
    "pyzbar>=0.1.9",
    "click>=8.3.1",
    "av>=16.1.0",
    "zarr==2.16.1",
]


[tool.setuptools]
packages = ["diffusion_policy", "real_world", "utils"]
py-modules = ["sitecustomize"]


[project.optional-dependencies]
umi = [
    "accelerate>=1.9.0",
    "atomics>=1.0.3",
    "av>=15.0.0",
    "cupy-cuda12x>=14.0.1",
    "dearpygui>=2.1.0",
    "diffusers>=0.37.0",
    "dill>=0.4.0",
    "einops>=0.8.1",
    "gym>=0.26.2",
    "hydra-core>=1.3.2",
    "imagecodecs>=2025.3.30",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "meshcat>=0.3.2",
    "natsort>=8.4.0",
    "numcodecs<=0.16",
    "nvidia-ml-py>=13.580.82",
    "omegaconf>=2.3.0",
    "peft>=0.17.1",
    "pin>=3.9.0",
    "plotly>=6.2.0",
    "pyarrow>=20.0.0",
    "pynput>=1.8.1",
    "pyserial>=3.5",
    "rich>=14.1.0",
    "robotic-arm>=1.1.4",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "socksio>=1.0.0",
    "timm>=1.0.17",
    "torch==2.7.0+cu128",
    "torchvision==0.22.0+cu128",
    "tqdm>=4.67.1",
    "transformers>=4.55.4",
    "wandb>=0.21.0",
    "webdataset>=1.0.2",
    "zarr==2.16.1",
]

[tool.ruff]
line-length = 150
select = ["F", "E", "W", "UP"]
ignore = ["F401", "E402", "F541", "UP006", "UP035", "I001", "I002"]

[tool.uv]
index-strategy = "unsafe-best-match"
index-url = "https://download.pytorch.org/whl/cu128"
extra-index-url = ["https://pypi.org/simple"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
